auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
auth_mechanisms.3 = EXTERNAL

vm_memory_high_watermark.absolute = 1900MiB
# vm_memory_high_watermark.paging_ratio = 0.7

heartbeat = 60

# {log_levels, [{channel, warning}, {connection, warning}, {federation, warning}, {mirroring, info}]},

listeners.tcp = none
listeners.ssl.default = 5673
ssl_options.cacertfile           = /run/secrets/millegrille.pem
ssl_options.certfile             = /run/secrets/cert.pem
ssl_options.keyfile              = /run/secrets/key.pem
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true
# {depth, 4},
ssl_options.versions.1           = tlsv1.3
ssl_options.versions.2           = tlsv1.2
