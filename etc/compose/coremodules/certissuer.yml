include:
  - path: ../include/app_net.yml
    project_directory: .

services:
  certissuer:
    image: registry.millegrilles.com/millegrilles/midcompte_python:2026.3.5
    ports:
      - "2080:2080"
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    command: ["-m", "millegrilles_certissuer"]
    environment:
      - INSTANCE_ID="${INSTANCE_ID}"
      - WEB_PORT=2080
      - CA_CERT_PATH=/run/secrets/millegrille.pem
      - SIGNING_CERT_PATH=/run/secrets/signing_ca.pem
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 1000
    configs:
      - source: millegrille_cert
        target: /run/secrets/millegrille.pem
    secrets:
      - source: signing_key
        target: signing_ca.pem

configs:
  millegrille_cert:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  signing_key:
    file: ${MILLEGRILLES_ROOT}/secrets/certissuer/signing_ca.pem
