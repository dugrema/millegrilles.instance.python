name: ${INSTANCE_NAME}-x509

services:
  certissuer:
    image: registry.millegrilles.com/millegrilles/midcompte_python:2026.6.30
    ports:
      - "2080:2080"
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    command: ["-m", "millegrilles_certissuer"]
    environment:
      - WEB_PORT=2080
      - SIGNING_PATH=/domains
    volumes:
      - ${MILLEGRILLES_ROOT}/secrets/certissuer:/domains:rw
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:2080/hosting" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  app_net:
    name: ${INSTANCE_NAME}_net
    external: true
