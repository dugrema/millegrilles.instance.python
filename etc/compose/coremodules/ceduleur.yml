services:
  ceduleur:
    image: registry.millegrilles.com/millegrilles/midcompte_python:2026.4.28
    x-millegrilles-certificat:
      roles:
        - ceduleur
      exchanges:
        - 4.secure
        - 3.protege
        - 2.prive
        - 1.public
    command: ["-m", "millegrilles_ceduleur"]
    environment:
      - INSTANCE_ID=${INSTANCE_ID}
      - CA_PATH=/run/secrets/pki.millegrille.cert
      - KEY_PATH=/run/secrets/key_cert.pem
      - MQ_HOSTNAME=mq
      - MQ_PORT=${MQ_PORT}
      - REDIS_HOSTNAME=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 250M
      restart_policy:
        condition: any
        delay: 30s
    configs:
      - source: mgca
        target: /run/secrets/pki.millegrille.cert
    secrets:
      - source: ceduleur
        target: key_cert.pem
    networks:
      - app_net
    depends_on:
      - redis
      - mq
      - midcompte

configs:
  mgca:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  ceduleur:
    file: ${MILLEGRILLES_ROOT}/secrets/ceduleur.pem

networks:
  app_net:
    name: ${INSTANCE_NAME}_net
    external: true
