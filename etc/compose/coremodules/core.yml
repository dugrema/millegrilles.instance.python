services:
  core:
    image: registry.millegrilles.com/millegrilles/core_rust:2026.0.119
    x-millegrilles-certificat:
      roles:
        - core
      exchanges:
        - 4.secure
        - 3.protege
        - 2.prive
        - 1.public
      domaines:
        - CoreBackup
        - CoreCatalogues
        - CoreMaitreDesComptes
        - CorePki
        - CoreTopologie
      dns:
        hostnames:
          - core
    environment:
      - MG_MQ_HOST=mq
      - MG_MQ_PORT=5673
      - MG_MONGO_HOST=mongo
      - MG_MQ_SSL=on
      - MG_MQ_AUTH_CERT=on
      - CERTFILE=/run/secrets/key.pem
      - KEYFILE=/run/secrets/key.pem
      - CAFILE=/run/secrets/millegrille.pem
      - MG_FICHIERS_URL=https://fichiers:443
      - MG_REDIS_URL=rediss://client_rust@redis:6379#insecure
      - MG_REDIS_PASSWORD_FILE=/run/secrets/passwd.redis.txt
      - RUST_LOG=warn
      - MG_CERTISSUER_URL=http://certissuer:2080
    volumes:
      - ${MILLEGRILLES_ROOT}/etc:/var/opt/millegrilles/configuration:ro
      - millegrilles-domain-archives:/var/opt/millegrilles/archives
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 200M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 1000
    configs:
      - source: ca
        target: /run/secrets/millegrille.pem
    secrets:
      - source: keycert
        target: key.pem
      - source: passwd_redis
        target: redis.txt
    networks:
      - app_net
