services:
  mq:
    image: registry.millegrilles.com/millegrilles/rabbitmq:4.3.4-management-alpine-b3
    x-millegrilles-certificat:
      roles:
        - mq
      dns:
        localhost: true
        hostnames:
          - mq
        domain: true
      split: true
    user: "${CONTAINER_UID}:${CONTAINER_GID}"
    hostname: mq
    environment:
      - NODENAME=rabbit@mq
    volumes:
      - ${MILLEGRILLES_ROOT}/var/mq:/var/lib/rabbitmq
    networks:
      - app_net
    ports:
      - "5673:5673"
      # - "8443:8443"
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2100M
      restart_policy:
        condition: any
        delay: 10s
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period:
        30s
    configs:
      - source: mgca
        target: /run/secrets/millegrille.pem
      - source: mq
        target: /run/secrets/cert.pem
    secrets:
      - source: mq
        target: key.pem

configs:
  mq:
    file: ${MILLEGRILLES_ROOT}/secrets/mq.cert.pem
  mgca:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  mq:
    file: ${MILLEGRILLES_ROOT}/secrets/mq.key.pem

networks:
  app_net:
    name: ${INSTANCE_NAME}_net
    external: true
