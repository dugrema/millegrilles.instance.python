name: ${INSTANCE_NAME}-web

services:
  nginx:
    image: registry.millegrilles.com/millegrilles/nginx:1.31.null.4
    x-millegrilles-certificat:
      roles:
        - nginx
      dns:
        localhost: true
        hostnames:
          - nginx
        domain: true
      split: true
    volumes:
      - ${MILLEGRILLES_ROOT}/etc/nginx:/etc/nginx/conf.d/modules:ro
      - ${MOUNT_NGINX_HTML}:/usr/share/nginx/html:ro
    networks:
      - app_net
    ports:
      - "443:443"
      - "444:444"
      - "80:80"
      - "1443:1443"
      - "1444:1444"
      - "1445:1445"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 75M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 1000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    configs:
      - source: webcert
        target: /run/secrets/webcert.pem
      - source: mgcert
        target: /run/secrets/nginx.cert.pem
      - source: mgca
        target: /usr/share/nginx/files/certs/millegrille.cert.pem
    secrets:
      - source: webkey
        target: webkey.pem
      - source: mgkey
        target: nginx.key.pem

configs:
  webcert:
    file: ${MILLEGRILLES_ROOT}/secrets/web.cert.pem
  mgcert:
    file: ${MILLEGRILLES_ROOT}/secrets/nginx.cert.pem
  mgca:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  webkey:
    file: ${MILLEGRILLES_ROOT}/secrets/web.key.pem
  mgkey:
    file: ${MILLEGRILLES_ROOT}/secrets/nginx.key.pem

networks:
  app_net:
    name: ${INSTANCE_NAME}_net
    external: true
