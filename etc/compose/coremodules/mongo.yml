services:
  mongo:
    image: mongo:8.2.6
    x-millegrilles-certificat:
      roles:
        - mongo
      dns:
        localhost: true
        hostnames:
          - mongo
        domain: true
      split: false
      passwords:
        - mongo
    hostname: mongo
    command: ["mongod", "--tlsMode", "requireTLS", "--tlsCertificateKeyFile", "/run/secrets/mongo.key_cert.pem", "--tlsCAFile", "/run/secrets/millegrille.cert.pem", "--replSet", "rs0", "--clusterAuthMode", "x509", "--tlsClusterFile", "/run/secrets/mongo.key_cert.pem"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo.root.password
    volumes:
      - ./var/mongo:/data/db
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2000M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 1000
    configs:
      - source: mgca
        target: /run/secrets/millegrille.cert.pem
    secrets:
      - source: mongo
        target: mongo.key_cert.pem
      - source: passwd_mongo
        target: mongo.root.password

configs:
  mgca:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  mongo:
    file: ${MILLEGRILLES_ROOT}/secrets/mongo.pem
  passwd_mongo:
    file: ${MILLEGRILLES_ROOT}/secrets/mongo.txt
