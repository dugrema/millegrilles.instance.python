services:
  webauth:
    image: registry.millegrilles.com/millegrilles/webauth_rust:2026.4.16
    x-millegrilles-certificat:
      roles:
        - webauth
      exchanges:
        - 1.public
      dns:
        localhost: true
        hostnames:
          - webauth
        domain: true
      passwords:
        - webauthsession
    environment:
      - MG_MQ_HOST=${MQ_HOSTNAME:-mq}
      - MG_MQ_PORT=${MQ_PORT:-5673}
      - MG_REDIS_URL=rediss://client_rust@redis:6379#insecure
      - REDIS_PORT=6379
      - MG_REDIS_PASSWORD_FILE=/run/secrets/redis.txt
      - MG_WEBAUTH_SESSION_PASSWORD_FILE=/run/secrets/webauthsession.txt
      - KEYFILE=/run/secrets/key_cert.pem
      - CAFILE=/run/secrets/millegrille.cert.pem
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 100M
      restart_policy:
        condition: any
        delay: 20s
    configs:
      - source: mgca
        target: /run/secrets/millegrille.cert.pem
    secrets:
      - source: webauth
        target: key_cert.pem
      - source: passwd_redis
        target: redis.txt
      - source: passwd_webauthsession
        target: webauthsession.txt
    networks:
      - app_net
    depends_on:
      - redis
      - mq
      - midcompte

configs:
  mgca:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  webauth:
    file: ${MILLEGRILLES_ROOT}/secrets/webauth.pem
  passwd_redis:
    file: ${MILLEGRILLES_ROOT}/secrets/redis.txt
  passwd_webauthsession:
    file: ${MILLEGRILLES_ROOT}/secrets/webauthsession.txt

networks:
  app_net:
    name: ${INSTANCE_NAME}_net
    external: true
